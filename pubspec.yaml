name: fdp
description: "Sweets & Ice Cream Delivery App — Multi-vendor marketplace with 3-minute shop confirmation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^10.3.4
  google_sign_in: ^6.2.1
  geolocator: ^13.0.4
  geocoding: ^4.0.0
  latlong2: ^0.10.1
  flutter_map: ^8.3.2
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/mishraji_logo.png
